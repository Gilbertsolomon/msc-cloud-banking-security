AWSTemplateFormatVersion: '2010-09-09'

Description: >
  MSc Cloud and Network Security dissertation prototype. CloudTrail auditing and CloudWatch monitoring layer for detecting security-relevant AWS management activity.

Resources:

  AuditLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced

      Tags:
      - Key: Name
        Value: MSc-Security-Audit-Logs
      - Key: Project
        Value: MSc-Banking-Security
      - Key: Environment
        Value: Research
      - Key: DataClassification
        Value: Security-Audit

  AuditLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

        - Sid: AWSCloudTrailAclCheck
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action:
          - s3:GetBucketAcl
          Resource: !GetAtt AuditLogBucket.Arn

        - Sid: AWSCloudTrailWrite
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action:
          - s3:PutObject
          Resource: !Sub '${AuditLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
          Condition:
            StringEquals:
              s3:x-amz-acl: bucket-owner-full-control

        - Sid: DenyInsecureTransport
          Effect: Deny
          Principal: '*'
          Action: 's3:*'
          Resource:
          - !GetAtt AuditLogBucket.Arn
          - !Sub '${AuditLogBucket.Arn}/*'
          Condition:
            Bool:
              aws:SecureTransport: false

  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /msc/banking-security/cloudtrail
      RetentionInDays: 7

      Tags:
      - Key: Project
        Value: MSc-Banking-Security
      - Key: Environment
        Value: Research

  CloudTrailCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MSc-CloudTrail-CloudWatch-Role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - cloudtrail.amazonaws.com
          Action:
          - sts:AssumeRole

      Policies:
      - PolicyName: CloudTrailCloudWatchDelivery
        PolicyDocument:
          Version: '2012-10-17'
          Statement:

          - Effect: Allow
            Action:
            - logs:CreateLogStream
            Resource:
            - !GetAtt CloudTrailLogGroup.Arn
            - !Sub '${CloudTrailLogGroup.Arn}:*'

          - Effect: Allow
            Action:
            - logs:PutLogEvents
            Resource:
            - !Sub '${CloudTrailLogGroup.Arn}:*'

      Tags:
      - Key: Project
        Value: MSc-Banking-Security
      - Key: Environment
        Value: Research

  BankingSecurityTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
    - AuditLogBucketPolicy
    Properties:
      TrailName: MSc-Banking-Security-Trail
      S3BucketName: !Ref AuditLogBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailCloudWatchRole.Arn

      EventSelectors:
      - ReadWriteType: All
        IncludeManagementEvents: true
        DataResources: []

      Tags:
      - Key: Project
        Value: MSc-Banking-Security
      - Key: Environment
        Value: Research

  AccessDeniedMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn:
    - BankingSecurityTrail
    Properties:
      LogGroupName: !Ref CloudTrailLogGroup

      FilterPattern: '{ ($.errorCode = "*AccessDenied*") || ($.errorCode = "UnauthorizedOperation") }'

      MetricTransformations:
      - MetricNamespace: MScBankingSecurity
        MetricName: AccessDeniedEvents
        MetricValue: '1'
        DefaultValue: 0

  AccessDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: MSc-Banking-AccessDenied-Alarm

      AlarmDescription: >
        Detects one or more AWS authorisation failures recorded by the banking security audit trail.

      Namespace: MScBankingSecurity
      MetricName: AccessDeniedEvents
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      Tags:
      - Key: Project
        Value: MSc-Banking-Security
      - Key: Environment
        Value: Research

Outputs:

  AuditBucketName:
    Description: S3 bucket containing CloudTrail audit logs
    Value: !Ref AuditLogBucket

  CloudTrailName:
    Description: Banking security CloudTrail trail
    Value: !Ref BankingSecurityTrail

  CloudTrailLogGroupName:
    Description: CloudWatch Logs group receiving audit events
    Value: !Ref CloudTrailLogGroup

  AccessDeniedAlarmName:
    Description: CloudWatch alarm monitoring authorisation failures
    Value: !Ref AccessDeniedAlarm
